[plugin]

name="ViDML C#"
description="The C# version of the ViDML pluggin. ViDML is short for \"Videogame Dialogue Markup Language\" and is to be used for creating dialogue windows with a wide range of customisation possibilities, the settings and text for which are defined within one or multiple XML files.  Largely inspired by Undertale and Deltarune with their creative usage of dialogue windows."
author="nicvampire"
version="1.0"
script="vidml_csharp.cs"
